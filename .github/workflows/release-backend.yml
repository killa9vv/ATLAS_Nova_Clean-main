name: Deploy backend

# Roda só depois de um push em main (ou seja, depois que uma PR já passou pelo
# gate de qualidade em ci.yml — este workflow não repete lint/testes, só builda
# e publica a imagem). paths: restringe a mudanças que realmente afetam a imagem,
# pra não rebuildar à toa quando só o frontend muda.
on:
  push:
    branches: [main]
    paths:
      - 'Código-fonte/backend/**'
      - '.github/workflows/release-backend.yml'

concurrency:
  group: deploy-backend-${{ github.ref }}
  # Nunca cancela um deploy em andamento pela metade — se dois pushes em main
  # acontecerem em sequência rápida, o segundo espera o primeiro terminar.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Fixo em minúsculas (não `${{ github.repository }}`) de propósito — registries
  # OCI exigem nome de repositório 100% minúsculo, e o nome real do repo no GitHub
  # tem maiúsculas ("ATLAS_Nova_Clean-main"). Actions não tem função toLower() nas
  # expressões, então usar github.repository aqui faz o push falhar sempre.
  IMAGE_NAME: killa9vv/atlas_nova_clean-main/backend

jobs:
  build-and-push:
    name: Build e publica imagem Docker (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN automático do Actions — já tem permissão de escrita em
          # ghcr.io por causa do `permissions: packages: write` acima (e de
          # "Read and write permissions" em Settings → Actions → General →
          # Workflow permissions). Nenhum secret novo precisa ser configurado
          # pra este passo funcionar.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx (necessário pro cache de camadas abaixo)
        uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: Código-fonte/backend
          file: Código-fonte/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # O Render não puxa a imagem nova sozinho — o Deploy Hook (URL secreta do
      # serviço, em Render → Settings → Deploy Hook) manda ele fazer o deploy da
      # :latest que acabou de ser publicada acima.
      #
      # De propósito SEM `if: secrets...`: o Actions não aceita o contexto `secrets`
      # em condições `if:` (nem de job nem de step) e rejeita o workflow inteiro
      # antes de rodar — muito provavelmente a causa dos "0 jobs, falha instantânea"
      # documentados em docs/deploy.md. A checagem fica no próprio script: sem o
      # secret, só avisa e segue (deploy manual continua funcionando).
      - name: Dispara o deploy no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK_URL não configurado — faça o deploy manual no Render."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy disparado no Render."

# Migrations de produção continuam manuais (ver docs/deploy.md) — o job `migrate`
# não voltou: aplicar migration automaticamente no banco de produção a cada push é
# uma decisão à parte (revisar o SQL antes, rollback etc.).
