name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, typecheck, testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Código-fonte/backend
    env:
      # Só pra satisfazer a validação de env (JWT_SECRET min. 16 chars) — nunca usado
      # pra assinar nada de verdade, o CI não expõe rotas autenticadas pra ninguém.
      JWT_SECRET: ci-test-secret-not-for-production-use
    services:
      # Fila de e-mails (BullMQ) precisa de Redis. O app não trava sem ele (conexão
      # falha rápido, ver BullmqEmailQueueAdapter), mas o worker força retry
      # infinito na própria conexão de bloqueio (exigência do BullMQ, não
      # configurável) — em CI isso estourou o timeout de 30s de um hook do Jest.
      # Serviço real aqui em vez de mock, mesmo padrão do Postgres embarcado abaixo.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Código-fonte/backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes unitários (com piso de cobertura no domínio)
        run: npm run test:cov

      - name: Testes e2e (Postgres embarcado)
        run: npm run test:e2e

      - name: Build de produção (mesmo comando usado na imagem Docker)
        run: npm run build

  docker-build:
    name: Build da imagem Docker de produção (build + smoke test)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: Código-fonte/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_nova_clean
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build (sem publicar — só valida que o Dockerfile builda)
        uses: docker/build-push-action@v7
        with:
          context: Código-fonte/backend
          file: Código-fonte/backend/Dockerfile
          push: false
          load: true
          tags: atlas-backend:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Código-fonte/backend/package-lock.json

      - name: Aplica migrations no Postgres do job (só pra este smoke test)
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_nova_clean

      # --network host: o container roda na mesma pilha de rede do runner, então
      # "localhost:5432" dentro dele chega no serviço postgres acima (published
      # em localhost pelo próprio Actions) sem precisar descobrir IP de container.
      - name: Sobe o container da imagem buildada e confere GET /health
        run: |
          # CORS_ORIGIN é obrigatório aqui: a imagem já sobe com NODE_ENV=production
          # (definido no Dockerfile), e validarCorsOrigin() recusa iniciar sem essa
          # variável quando NODE_ENV=production — trava de segurança proposital pra
          # nunca liberar CORS geral em produção por esquecimento, não um bug do
          # smoke test.
          docker run -d --name atlas-backend-check --network host \
            -e DATABASE_URL="postgresql://atlas:atlas@localhost:5432/atlas_nova_clean" \
            -e JWT_SECRET="ci-docker-check-secret-not-for-real-use" \
            -e CORS_ORIGIN="http://localhost:3001" \
            -e PORT=3000 \
            atlas-backend:ci-check

          ok=""
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health; then
              ok=1
              break
            fi
            sleep 2
          done

          echo
          docker logs atlas-backend-check
          docker inspect --format='HEALTHCHECK status: {{.State.Health.Status}}' atlas-backend-check || true

          if [ -z "$ok" ]; then
            echo "GET /health não respondeu 200 a tempo — ver logs acima."
            exit 1
          fi

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Código-fonte/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Código-fonte/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
