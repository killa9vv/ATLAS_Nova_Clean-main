name: Deploy backend

# Roda só depois de um push em main (ou seja, depois que uma PR já passou pelo
# gate de qualidade em ci.yml — este workflow não repete lint/testes, só builda
# e publica a imagem). paths: restringe a mudanças que realmente afetam a imagem,
# pra não rebuildar à toa quando só o frontend muda.
on:
  push:
    branches: [main]
    paths:
      - 'Código-fonte/backend/**'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend-${{ github.ref }}
  # Nunca cancela um deploy em andamento pela metade — se dois pushes em main
  # acontecerem em sequência rápida, o segundo espera o primeiro terminar.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Fixo em minúsculas (não `${{ github.repository }}`) de propósito — registries
  # OCI exigem nome de repositório 100% minúsculo, e o nome real do repo no GitHub
  # tem maiúsculas ("ATLAS_Nova_Clean-main"). Actions não tem função toLower() nas
  # expressões, então usar github.repository aqui faz o push falhar sempre.
  IMAGE_NAME: killa9vv/atlas_nova_clean-main/backend

jobs:
  build-and-push:
    name: Build e publica imagem Docker (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN automático do Actions — já tem permissão de escrita em
          # ghcr.io por causa do `permissions: packages: write` acima (e de
          # "Read and write permissions" em Settings → Actions → General →
          # Workflow permissions). Nenhum secret novo precisa ser configurado
          # pra este passo funcionar.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx (necessário pro cache de camadas abaixo)
        uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: Código-fonte/backend
          file: Código-fonte/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Aplica migrations no banco de produção
    runs-on: ubuntu-latest
    needs: build-and-push
    # TODO(deploy backend + banco gerenciado): este job fica parado (skip) até o
    # secret PRODUCTION_DATABASE_URL existir no repositório. Sem banco de produção
    # decidido ainda, não há URL real pra rodar `prisma migrate deploy` contra —
    # ativa sozinho assim que o secret for criado, sem precisar editar este arquivo.
    if: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
    defaults:
      run:
        working-directory: Código-fonte/backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Código-fonte/backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # `migrate deploy` (não `migrate dev`): só aplica migrations já existentes no
      # repo, nunca gera uma nova nem pede confirmação interativa — é o comando
      # seguro pra rodar em CI/produção (mesmo padrão já usado em
      # scripts/docker-entrypoint.dev.sh pro ambiente de dev via Docker Compose).
      - name: prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy

  deploy:
    name: Deploy no host de produção
    runs-on: ubuntu-latest
    needs: migrate
    # TODO(deploy backend + banco gerenciado): mesmo gate do job `migrate` acima —
    # sem host de produção escolhido (Railway/Render/Fly.io/VPS — card ainda não
    # iniciado), não existe onde publicar a imagem. Ver docs/deploy.md pra saber
    # exatamente o que preencher aqui quando o host for decidido.
    if: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
    steps:
      - name: "TODO: publicar a imagem no host de produção"
        run: |
          echo "::warning::Passo de deploy real ainda não implementado — host de produção não foi escolhido (card 'Deploy backend + banco gerenciado')."
          echo "Imagem já publicada em ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}, pronta pra ser puxada assim que o host existir."
          echo "Ver docs/deploy.md na raiz do backend pro que precisa ser preenchido aqui (secret do host, comando/CLI de deploy)."
