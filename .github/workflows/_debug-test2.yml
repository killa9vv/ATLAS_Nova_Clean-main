name: Debug test 2 paths
on:
  push:
    branches: [main]
    paths:
      - 'Código-fonte/backend/**'
      - '.github/workflows/_debug-test2.yml'

concurrency:
  group: debug-test2-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: killa9vv/atlas_nova_clean-main/backend-debug

jobs:
  build-and-push:
    name: Build e publica imagem Docker (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: Código-fonte/backend
          file: Código-fonte/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Aplica migrations no banco de producao
    runs-on: ubuntu-latest
    needs: build-and-push
    defaults:
      run:
        working-directory: Código-fonte/backend
    steps:
      - if: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
        uses: actions/checkout@v5
      - if: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Código-fonte/backend/package-lock.json
      - if: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
        run: npm ci
      - if: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy

  deploy:
    name: Deploy no host de producao
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - if: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
        run: echo "deploy placeholder"
